server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's internal DNS. Resolving "api" per request (via a variable) instead of once at startup
    # keeps the proxy working after the api container restarts with a new IP.
    resolver 127.0.0.11 valid=10s;
    set $api_upstream http://api:8080;

    # Same origin for UI and API, so the browser needs no CORS.
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host; # keeps the port, so Location headers point at :3000
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Hashed build files never change: cache them forever, and 404 (not index.html) when missing.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page app: unknown paths (e.g. /jobs/123 on refresh) serve index.html and React Router takes over.
    # index.html is never cached, so a rebuild is picked up immediately.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
